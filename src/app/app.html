<a class="skip-link" href="#main">تخطَّ إلى المحتوى</a>

<div class="shell">
  <header class="masthead">
    <a class="masthead__brand" routerLink="/books">رفّ الكتب</a>
    <nav class="masthead__nav" aria-label="التنقل الرئيسي">
      <a routerLink="/books">كل الكتب</a>
      <a routerLink="/compare">
        المقارنة
        <!-- Announced when it changes, so the count is not a visual-only signal. -->
        <span class="masthead__count" aria-live="polite">({{ favourites.count() }})</span>
      </a>
    </nav>
  </header>

  <main id="main" class="main" tabindex="-1">
    <router-outlet />
  </main>

  <footer class="colophon">
    <p>فهرس صغير. تفاصيل الكتب مصدرها Google Books.</p>
  </footer>
</div>
